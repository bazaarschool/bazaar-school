# Netlify build configuration for bazaarschool.com
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# The Netlify address shows the same site, so send its visitors to the real domain.
# Deploy previews and branch deploys use other netlify.app addresses and keep working.
[[redirects]]
  from = "https://bazaarschool.netlify.app/*"
  to = "https://bazaarschool.com/:splat"
  status = 301
  force = true

# Sensible security headers for a static site.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Astro gives every CSS and JavaScript file under /_astro/ a fingerprinted name, and a
# changed file gets a new name, so browsers can safely keep these files for a year.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Keep the editor out of search results.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Robots-Tag = "noindex"
